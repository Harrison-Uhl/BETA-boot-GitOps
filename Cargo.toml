[package]
name = "rar-chat"
version = "0.1.0"
edition = "2021"
description = "Minimal terminal chat with explicit DriverEventHandler routing and telemetry."

[dependencies]
tokio = { version = "=1.36.0", features = ["full"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio-util = "=0.7.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "=2.5.0"
indexmap = "=2.2.6"
hashbrown = "=0.14.5"
